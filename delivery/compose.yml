# Deployment uses only published registry images. No build on the target host.
name: postik_${POSTIK_ENV_NAME:?}
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://postik:${DB_PASSWORD:?}@db:5432/postik
  JWT_SECRET: ${JWT_SECRET:?}
  APP_ENV: ${POSTIK_ENV_NAME:?}
  APP_VERSION: ${APP_VERSION:?}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?}
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postik
      POSTGRES_USER: postik
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [db_net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postik -d postik']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    image: ${API_IMAGE:?}
    restart: 'no'
    environment: *api-env
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    networks: [db_net]
  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [db_net, web_net]
    healthcheck:
      test: [CMD, python, '-c', "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    networks: [web_net, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.postik-staging.rule=Host(`postik-staging.home.rimashi.ru`)"
      - "traefik.http.routers.postik-staging.entrypoints=web"
      - "traefik.http.services.postik-staging.loadbalancer.server.port=8080"
    ports: ['127.0.0.1:${HTTP_PORT:-8088}:8080']
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 4s
      retries: 5
    read_only: true
    tmpfs:
      - '/tmp:rw,noexec,nosuid,size=32m'
      - '/var/cache/nginx:rw,nosuid,size=16m'
      - '/var/run:rw,nosuid,size=4m'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  web_net: {}
  db_net: {internal: true}
  proxy:
    external: true
volumes:
  pg_data: {}
