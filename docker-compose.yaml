services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    env_file:
      - /etc/postik/postik.env

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped

    env_file:
      - /etc/postik/postik.env

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/static/uploads

volumes:
  postgres_data:
  uploads_data:
