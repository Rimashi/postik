# Основной контейнерный стек: web -> api -> db, миграции выполняются один раз.
name: postik_stack

x-api-environment: &api-env
  DATABASE_URL: postgresql+psycopg://postik:${DB_PASSWORD:?Set_DB_PASSWORD}@db:5432/postik
  JWT_SECRET: ${JWT_SECRET:?Set_JWT_SECRET}
  APP_ENV: development
  COOKIE_SECURE: '0' # Локально HTTP; на HTTPS должно стать 1.
  ACCESS_MINUTES: '60'
  ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088

x-api-build: &api-build
  context: .
  dockerfile: backend/Dockerfile

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postik
      POSTGRES_USER: postik
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD}
    volumes:
      - data_pg:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postik -d postik"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: '1.0'
    security_opt:
      - no-new-privileges:true

  migrate:
    image: postik-api:local
    build: *api-build
    restart: 'no'
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data_net
    mem_limit: 256m
    cpus: '0.5'
    security_opt:
      - no-new-privileges:true

  api:
    image: postik-api:local
    build: *api-build
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - data_net
      - frontend_net
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    # Не публикуем порт 8000! Только Nginx внутри сети обращается к api:8000.
    mem_limit: 384m
    cpus: '1.0'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  web:
    image: postik-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend_net
    ports:
      - '127.0.0.1:8088:8080'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
    mem_limit: 128m
    cpus: '0.5'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,nosuid,size=16m
      - /var/run:rw,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net: {}
  data_net:
    internal: true

volumes:
  data_pg: {}
