<header class="header">
  <div class="header__container _container">
    <div class="header__top">
      <div class="header__logo">
        <h1><a href="{{ url_for('main.index') }}">PostS_ME</a></h1>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">🌙</button>
    </div>

    <div class="menu__icon">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <nav class="header__menu menu">
      <ul class="menu__list">
        <li class="menu__item {% if request.endpoint == 'posts.list_of_posts' %}menu__item--active{% endif %}">
          <a href="{{ url_for('posts.list_of_posts') }}">Посты</a>
        </li>
        <li class="menu__item {% if request.endpoint == 'posts.create_post_page' %}menu__item--active{% endif %}">
          <a href="{{ url_for('posts.create_post_page') }}">Создать</a>
        </li>
        <li class="menu__item {% if request.endpoint == 'posts.my_posts_page' %}menu__item--active{% endif %}">
          <a href="{{ url_for('posts.my_posts_page') }}">Мои статьи</a>
        </li>
        {% if current_user.is_admin %}
        <li class="menu__item {% if request.endpoint == 'admin.admin_panel' %}menu__item--active{% endif %}">
          <a href="{{ url_for('admin.admin_panel') }}">Админ-панель</a>
        </li>
        {% endif %}
        <li class="menu__item">
          <a href="{{ url_for('user.logout') }}">Выход</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
