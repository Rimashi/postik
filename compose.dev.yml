# Сохраняем имя Compose-проекта прежней локальной БД: backend-db-1 и backend_postgres_data.
# ВАЖНО: база данных здесь остаётся самостоятельной от основного контейнерного стека.
name: backend
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postik
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: postik

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postik -d postik']
      interval: 2s
      timeout: 3s
      retries: 20

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
