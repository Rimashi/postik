# Общие правила Ruff для корневых служебных скриптов. Сервер использует те же
# параметры в backend/pyproject.toml.
target-version = "py311"
line-length = 100
exclude = [".venv", "reports", "node_modules", ".pytest_cache", "__pycache__"]
[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
